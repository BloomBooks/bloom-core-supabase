name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        run: yarn test:ci
        env:
          BLOOM_PARSE_APP_ID_PROD: ${{ secrets.BLOOM_PARSE_APP_ID_PROD }}
          BLOOM_PARSE_APP_ID_DEV: ${{ secrets.BLOOM_PARSE_APP_ID_DEV }}
          BLOOM_PARSE_APP_ID_UNIT_TEST: ${{ secrets.BLOOM_PARSE_APP_ID_UNIT_TEST }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: staging
      url: https://${{ secrets.BLOOM_SUPABASE_STAGING_PROJECT_ID }}.supabase.co
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Staging
        run: supabase functions deploy --project-ref ${{ secrets.BLOOM_SUPABASE_STAGING_PROJECT_ID }}
        env:
          BLOOM_SUPABASE_ACCESS_TOKEN: ${{ secrets.BLOOM_SUPABASE_ACCESS_TOKEN }}
