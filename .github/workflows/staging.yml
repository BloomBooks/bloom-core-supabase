name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test and Deploy to Staging
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Type-check everything, including entry points like fs/index.ts that
      # no test imports (deno test only checks the test files' import graphs).
      - name: Type-check functions
        run: deno check --frozen $(find supabase/functions -name '*.ts')

      - name: Run tests
        run: pnpm test:ci
        env:
          BLOOM_PARSE_APP_ID_PROD: ${{ secrets.BLOOM_PARSE_APP_ID_PROD }}
          BLOOM_PARSE_APP_ID_DEV: ${{ secrets.BLOOM_PARSE_APP_ID_DEV }}
          BLOOM_PARSE_APP_ID_UNIT_TEST: ${{ secrets.BLOOM_PARSE_APP_ID_UNIT_TEST }}
          BLOOM_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.BLOOM_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          BLOOM_GOOGLE_SERVICE_PRIVATE_KEY: ${{ secrets.BLOOM_GOOGLE_SERVICE_PRIVATE_KEY }}
          BLOOM_SUBSCRIPTION_SPREADSHEET_ID: ${{ secrets.BLOOM_SUBSCRIPTION_SPREADSHEET_ID }}

      # Keep in sync with the supabase version pinned in package.json.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Apply database migrations to Staging
        run: |
          supabase link --project-ref ${{ secrets.BLOOM_SUPABASE_STAGING_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BLOOM_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BLOOM_SUPABASE_STAGING_DB_PASSWORD }}

      - name: Deploy Edge Functions to Staging
        run: supabase functions deploy --project-ref ${{ secrets.BLOOM_SUPABASE_STAGING_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BLOOM_SUPABASE_ACCESS_TOKEN }}
