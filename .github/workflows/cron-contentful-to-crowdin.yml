# Replaces the Azure timer trigger for contentfulToCrowdin (daily at 22:30 UTC,
# same schedule as the Azure function). Supabase edge functions have no timer
# trigger, so this workflow invokes the deployed function on a cron.
#
# The scheduled run always invokes the production deployment. You can also run
# it manually ("Run workflow" in the Actions tab) and choose which deployment to
# invoke: staging (the code deployed to the staging project) or production. It
# defaults to staging so a manual run exercises the staging deployment.
#
# Whether an invocation actually uploads to Crowdin or just reports counts is a
# separate matter, controlled per deployment by the BLOOM_CONTENTFUL_TO_CROWDIN_
# ENABLE_UPLOAD env var on that Supabase project (only production sets it to
# "true"); it is not decided by this workflow.
#
# Required repository secrets:
#   BLOOM_SUPABASE_PRODUCTION_PROJECT_ID - the production Supabase project ref
#   BLOOM_SUPABASE_STAGING_PROJECT_ID    - the staging Supabase project ref
#   BLOOM_CRON_SECRET - shared secret; must match the invoked function's
#                       BLOOM_CRON_SECRET (both the staging and production
#                       deployments need this set for the invocation to work)
#
# A failed run triggers GitHub's normal workflow-failure notifications.

name: "Cron: contentfulToCrowdin"

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to invoke: staging or production. (Whether it uploads to Crowdin is set per deployment, not here.)"
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke contentfulToCrowdin edge function
        env:
          # Scheduled runs always invoke production. Manual runs use the chosen
          # deployment, defaulting to staging.
          TARGET_ENV: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
          STAGING_PROJECT_ID: ${{ secrets.BLOOM_SUPABASE_STAGING_PROJECT_ID }}
          PRODUCTION_PROJECT_ID: ${{ secrets.BLOOM_SUPABASE_PRODUCTION_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.BLOOM_CRON_SECRET }}
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            project_id="$PRODUCTION_PROJECT_ID"
          else
            project_id="$STAGING_PROJECT_ID"
          fi
          echo "Invoking contentfulToCrowdin on $TARGET_ENV"
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://${project_id}.supabase.co/functions/v1/contentfulToCrowdin" \
            -H "x-bloom-cron-secret: ${CRON_SECRET}")
          echo "HTTP $status"
          cat response.txt
          test "$status" = "200"
